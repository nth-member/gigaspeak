<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self' about:; base-uri 'none'; form-action 'none'">
<title>Gigaspeak renderer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232a78d6'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='monospace' fill='white'%3E%3C/%3E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body class="render">
<header class="render-head">
  <div class="render-title"><a href="./">Gigaspeak</a> · <span id="speaker">—</span></div>
  <div class="render-meta" id="meta">Reading the transmission…</div>
  <div class="render-tools" hidden id="tools">
    <label><input type="checkbox" id="labels"> show byte labels</label>
    <button type="button" id="copyText">Copy decoded text</button>
  </div>
</header>
<main>
  <div id="output" class="output"></div>
  <pre id="error" class="error" hidden></pre>
</main>
<script type="module" src="render.mjs"></script>
</body>
</html>
